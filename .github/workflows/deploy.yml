name: Déployer sur Apps Script

# Se déclenche quand le code arrive sur main (donc à chaque merge de PR),
# et manuellement depuis l'onglet Actions — bouton utilisable sur mobile.
on:
  push:
    branches: [main]
    paths:
      - 'Html.txt'
      - 'Code cs.txt'
      - 'deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      description:
        description: "Libellé du déploiement"
        required: false
        default: "auto"

# Une seule publication à la fois : deux déploiements simultanés sur le
# même deploymentId se marcheraient dessus.
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Écrire les identifiants clasp
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then
            echo "::error::Le secret CLASPRC_JSON est absent. Voir context/session-recap.md."
            exit 1
          fi
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Déployer
        env:
          DEPLOY_DESC: ${{ github.event.inputs.description || github.event.head_commit.message }}
        run: bash deploy.sh --publish
